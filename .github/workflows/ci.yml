name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Test
        run: bun test

      - name: Build site bundle
        run: bun run build:site

      - name: Check site
        run: bun run check:site

      - name: Ensure committed site bundle is up to date
        run: git diff --exit-code -- site/assets/demo.js

      - name: Write fixtures
        run: bun run make-fixtures

      - name: CLI fails on the bad fixture
        run: |
          if bun run src/cli.ts fixtures/bad.svg; then
            echo "::error::expected a non-zero exit for fixtures/bad.svg"
            exit 1
          fi

      - name: CLI passes on the good fixture
        run: bun run src/cli.ts fixtures/good.svg
